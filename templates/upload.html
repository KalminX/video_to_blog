{% extends "base.html" %}

{% block content %}
<div class="mx-auto px-4 py-6 container">
    <div class="bg-white shadow-lg mx-auto p-6 rounded-lg max-w-4xl">
        <h1 class="mb-6 font-bold text-3xl md:text-4xl text-center">Upload Audio/Video</h1>

        <div class="gap-6 grid md:grid-cols-2">
            <!-- File Upload Section -->
            <div>
                <h2 class="mb-4 font-semibold text-lg md:text-xl">Upload File</h2>
                <div id="dropZone"
                    class="hover:bg-teal-50 p-6 border-2 border-teal-500 border-dashed rounded-lg text-center transition duration-200 cursor-pointer">
                    <input id="fileInput" type="file" accept="audio/*,video/*" class="hidden" />
                    <p id="dropText" class="text-gray-600">Drag & drop or click to select a file</p>
                </div>
                <div class="flex md:flex-row flex-col gap-4 mt-4">
                    <button id="uploadBtn"
                        class="bg-teal-500 hover:bg-teal-600 disabled:opacity-60 px-4 py-2 rounded-lg w-full md:w-auto text-white transition duration-200"
                        disabled>Start Processing</button>
                    <button id="clearBtn"
                        class="bg-white hover:bg-gray-100 px-4 py-2 border border-gray-300 rounded-lg w-full md:w-auto text-gray-700 transition duration-200">Clear</button>
                </div>
            </div>

            <!-- YouTube Upload Section -->
            <div>
                <h2 class="mb-4 font-semibold text-lg md:text-xl">YouTube URL</h2>
                <div class="flex md:flex-row flex-col gap-4">
                    <input id="youtubeInput" type="text"
                        class="flex-1 p-2 border border-gray-300 focus:border-transparent rounded-lg focus:ring-2 focus:ring-teal-500"
                        placeholder="Enter YouTube URL">
                    <button id="youtubeUploadBtn"
                        class="bg-teal-500 hover:bg-teal-600 px-4 py-2 rounded-lg w-full md:w-auto text-white transition duration-200">Start
                        Processing</button>
                </div>
            </div>
        </div>

        <!-- Progress Bar & Live Output -->
        <div class="mt-6">
            <div class="flex justify-between items-center mb-2">
                <div id="stageText" class="text-gray-600 text-sm md:text-base">Waiting for input</div>
                <a id="downloadBtn" href="#" target="_blank"
                    class="hidden bg-indigo-600 hover:bg-indigo-700 px-3 py-2 rounded-lg text-white transition duration-200">Download
                    Output</a>
            </div>
            <div class="bg-gray-200 rounded-full h-2.5 overflow-hidden">
                <div id="progressBar" class="bg-teal-500 rounded-full h-2.5 transition-all duration-300"
                    style="width: 0%;"></div>
            </div>
            <div class="flex justify-between mt-1 text-gray-500 text-xs md:text-sm">
                <span id="progressLabel">0%</span>
                <span id="statusLabel">idle</span>
            </div>

            <div class="mt-6">
                <h4 class="mb-2 font-medium text-gray-700 text-sm md:text-base">Live Output</h4>
                <pre id="transcript"
                    class="bg-gray-900 p-4 rounded-lg max-h-60 md:max-h-72 overflow-y-auto font-mono text-green-300 text-sm"></pre>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        const socket = io();
        let selectedFile = null;
        let currentTaskId = null;
        let processing = false;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const youtubeInput = document.getElementById('youtubeInput');
        const youtubeUploadBtn = document.getElementById('youtubeUploadBtn');
        const progressBar = document.getElementById('progressBar');
        const progressLabel = document.getElementById('progressLabel');
        const statusLabel = document.getElementById('statusLabel');
        const stageText = document.getElementById('stageText');
        const transcriptEl = document.getElementById('transcript');
        const downloadBtn = document.getElementById('downloadBtn');

        function resetUI() {
            selectedFile = null;
            currentTaskId = null;
            processing = false;
            fileInput.value = '';
            youtubeInput.value = '';
            uploadBtn.disabled = true;
            youtubeUploadBtn.disabled = false;
            progressBar.style.width = '0%';
            progressLabel.textContent = '0%';
            statusLabel.textContent = 'idle';
            stageText.textContent = 'Waiting for input';
            transcriptEl.textContent = '';
            downloadBtn.classList.add('hidden');
            downloadBtn.href = '#';
        }

        function setProgress(pct, status) {
            progressBar.style.width = pct + '%';
            progressLabel.textContent = pct + '%';
            statusLabel.textContent = status || '';
        }

        function selectFile(file) {
            selectedFile = file;
            uploadBtn.disabled = false;
            stageText.textContent = `File ready: ${file.name}`;
        }

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drop-active'); });
        dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('drop-active'); });
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drop-active');
            const f = e.dataTransfer.files[0];
            if (f) selectFile(f);
        });

        fileInput.addEventListener('change', e => { const f = e.target.files[0]; if (f) selectFile(f); });
        clearBtn.addEventListener('click', resetUI);

        uploadBtn.addEventListener('click', () => {
            if (!selectedFile || processing) return;
            processing = true;
            uploadBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', selectedFile);

            fetch('/upload', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(res => {
                    if (res.task_id) {
                        currentTaskId = res.task_id;
                        setProgress(0, 'Task started');
                        stageText.textContent = 'Processing...';
                        transcriptEl.textContent = '';
                    } else {
                        setProgress(0, 'Failed to start task: ' + (res.error || 'Unknown'));
                        processing = false;
                        uploadBtn.disabled = false;
                    }
                })
                .catch(err => {
                    console.error('[Upload Error]', err);
                    setProgress(0, 'An error occurred');
                    processing = false;
                    uploadBtn.disabled = false;
                });
        });

        youtubeUploadBtn.addEventListener('click', () => {
            const url = youtubeInput.value.trim();
            if (!url || processing) return;

            processing = true;
            youtubeUploadBtn.disabled = true;
            setProgress(0, 'Starting task...');

            const formData = new FormData();
            formData.append('youtube_url', url);

            fetch('/upload-youtube', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(res => {
                    if (res.task_id) {
                        currentTaskId = res.task_id;
                        setProgress(0, 'Task started');
                        stageText.textContent = 'Processing...';
                        transcriptEl.textContent = '';
                    } else {
                        setProgress(0, 'Failed to start task: ' + (res.error || 'Unknown'));
                        processing = false;
                        youtubeUploadBtn.disabled = false;
                    }
                })
                .catch(err => {
                    console.error('[YouTube Upload Error]', err);
                    setProgress(0, 'An error occurred');
                    processing = false;
                    youtubeUploadBtn.disabled = false;
                });
        });

        socket.on('progress', data => {
            if (!currentTaskId || data.task_id !== currentTaskId) return;
            const pct = Math.min(100, data.percent || 0);

            setProgress(pct, data.message || 'Working...');
            stageText.textContent = data.message || 'Processing...';

            if (data.text_chunk) {
                transcriptEl.innerText += data.text_chunk + "\n\n";
                transcriptEl.scrollTop = transcriptEl.scrollHeight;
            }

            if (["done", "finished", "download"].includes(data.stage) || pct >= 100) {
                setProgress(100, 'Task completed');

                if (data.download_url) {
                    downloadBtn.classList.remove('hidden');
                    downloadBtn.href = data.download_url;
                }

                processing = false;
                uploadBtn.disabled = false;
                youtubeUploadBtn.disabled = false;
            }
        });

        socket.on('connect', () => console.log('Socket connected'));
        socket.on('disconnect', () => console.log('Socket disconnected'));

        resetUI();
    })();
</script>
{% endblock %}
