{% extends "base.html" %}

{% block content %}
<div class="mx-auto px-4 py-12 max-w-lg text-center">
    <div class="bg-green-50 shadow-md p-8 border border-green-400 rounded-xl text-green-700">
        <h1 class="mb-3 font-bold text-2xl">🎉 Payment Successful!</h1>
        <p class="mb-4">Your payment has been verified successfully.</p>
        <p>You’ve received <strong>{{ credits_added }}</strong> new credits.</p>
        <a href="{{ url_for('dashboard') }}"
            class="inline-block bg-teal-600 hover:bg-teal-700 mt-6 px-6 py-2 rounded-lg font-semibold text-white">
            Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
