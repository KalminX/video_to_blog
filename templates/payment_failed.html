{% extends "base.html" %}

{% block content %}
<div class="mx-auto px-4 py-12 max-w-lg text-center">
    <div class="bg-red-50 shadow-md p-8 border border-red-400 rounded-xl text-red-700">
        <h1 class="mb-3 font-bold text-2xl">❌ Payment Failed</h1>
        <p>{{ message or "Your payment could not be verified." }}</p>
        <a href="{{ url_for('buy_credits_page') }}"
            class="inline-block bg-teal-600 hover:bg-teal-700 mt-6 px-6 py-2 rounded-lg font-semibold text-white">
            Try Again
        </a>
    </div>
</div>
{% endblock %}
